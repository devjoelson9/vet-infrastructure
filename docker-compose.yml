name: vet-sistema

networks:
  vet-network:
    driver: bridge

volumes:
  postgres_identidade_data:
  postgres_clinico_data:
  postgres_agendamento_data:
  postgres_faturamento_data:
  rabbitmq_data:

services:
  # ==================================================
  # BANCOS DE DADOS (Database-per-Service)
  # ==================================================
  bd-identidade:
    image: postgres:16-alpine
    container_name: bd-identidade
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_IDENTIDADE:-db_identidade}
      POSTGRES_USER: ${POSTGRES_USER:-vet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vet_password}
    volumes:
      - postgres_identidade_data:/var/lib/postgresql/data
    networks:
      - vet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vet_user} -d ${POSTGRES_DB_IDENTIDADE:-db_identidade}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  bd-clinico:
    image: postgres:16-alpine
    container_name: bd-clinico
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_CLINICO:-db_clinico}
      POSTGRES_USER: ${POSTGRES_USER:-vet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vet_password}
    volumes:
      - postgres_clinico_data:/var/lib/postgresql/data
    networks:
      - vet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vet_user} -d ${POSTGRES_DB_CLINICO:-db_clinico}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  bd-agendamento:
    image: postgres:16-alpine
    container_name: bd-agendamento
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_AGENDAMENTO:-db_agendamento}
      POSTGRES_USER: ${POSTGRES_USER:-vet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vet_password}
    volumes:
      - postgres_agendamento_data:/var/lib/postgresql/data
    networks:
      - vet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vet_user} -d ${POSTGRES_DB_AGENDAMENTO:-db_agendamento}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ==================================================
  # MENSAGERIA
  # ==================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: message-broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - vet-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  # Caixa de e-mail local usada pelo serviço de identidade
  # (recuperação de senha). UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - vet-network

  # ==================================================
  # MICROSSERVIÇOS
  # ==================================================
  servico-identidade:
    build:
      context: ../vet-identidade-service
      dockerfile: Dockerfile
    container_name: servico-identidade
    restart: unless-stopped
    environment:
      DB_HOST: bd-identidade
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB_IDENTIDADE:-db_identidade}
      DB_USER: ${POSTGRES_USER:-vet_user}
      DB_PASS: ${POSTGRES_PASSWORD:-vet_password}
      JWT_SECRET: ${JWT_SECRET:-uma-chave-secreta-muito-longa-e-segura-para-hmac-sha256-com-pelo-menos-256-bits}
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION_MS: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      MAIL_FROM: ${MAIL_FROM:-noreply@vet.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      bd-identidade:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - vet-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  servico-clinico:
    build:
      context: ../vet-clinico-service
      dockerfile: Dockerfile
    container_name: servico-clinico
    restart: unless-stopped
    environment:
      DB_HOST: bd-clinico
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB_CLINICO:-db_clinico}
      DB_USER: ${POSTGRES_USER:-vet_user}
      DB_PASS: ${POSTGRES_PASSWORD:-vet_password}
      JWT_SECRET: ${JWT_SECRET:-uma-chave-secreta-muito-longa-e-segura-para-hmac-sha256-com-pelo-menos-256-bits}
      # Consultas síncronas à identidade e ao agendamento durante o atendimento
      IDENTIDADE_BASE_URL: http://servico-identidade:8080
      AGENDAMENTO_BASE_URL: http://servico-agendamento:8080
      # Publica eventos de atendimento (exchange vet.events) no RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      bd-clinico:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vet-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  servico-agendamento:
    build:
      context: ../vet-agendamento-service
      dockerfile: Dockerfile
    container_name: servico-agendamento
    restart: unless-stopped
    environment:
      DB_HOST: bd-agendamento
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB_AGENDAMENTO:-db_agendamento}
      DB_USER: ${POSTGRES_USER:-vet_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vet_password}
      JWT_SECRET: ${JWT_SECRET:-uma-chave-secreta-muito-longa-e-segura-para-hmac-sha256-com-pelo-menos-256-bits}
      # Chamadas HTTP síncronas para validar tutor/animal
      IDENTIDADE_BASE_URL: http://servico-identidade:8080
      # Consome eventos de atendimento publicados pelo serviço clínico
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      bd-agendamento:
        condition: service_healthy
      servico-identidade:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vet-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ==================================================
  # FRONTEND E API GATEWAY
  # ==================================================
  interface-web:
    build:
      context: ../vet-frontend-web
      dockerfile: Dockerfile
      args:
        VITE_API_GATEWAY_URL: /api
        VITE_API_BASE_URL: /api
        VITE_BACKEND_URL: http://api-gateway
    container_name: interface-web
    restart: unless-stopped
    networks:
      - vet-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  api-gateway:
    build:
      context: ../vet-api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      interface-web:
        condition: service_started
      servico-identidade:
        condition: service_healthy
      servico-clinico:
        condition: service_healthy
      servico-agendamento:
        condition: service_healthy
    networks:
      - vet-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ==================================================
  # FATURAMENTO (ainda NÃO integrado)
